group 'com.facilityflow.phone_settings'
version '1.0'

// Built only inside the app: the Android Gradle plugin and the repositories come from the
// app's own build, and Flutter applies the Kotlin plugin to every Android library that does
// not apply it itself.
apply plugin: 'com.android.library'

android {
    namespace 'com.facilityflow.phone_settings'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
